  #   needs: changes
  #   if: ${{ needs.changes.outputs.server == 'true' }}
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: docker compose up -d --build --wait --wait-timeout 300
  #     - run: curl -fsS http://localhost:8080/health
  #     - if: always()
  #       run: docker compose down -v
