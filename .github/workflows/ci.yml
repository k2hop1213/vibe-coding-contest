name: CI

on:
  push:
    branches: [main]
  # ⚠️⚠️ 이 트리거에 절대 branches 필터를 걸지 않는다. ⚠️⚠️
  # base를 main·dev로 제한하면 "스택 PR"(base가 다른 feature 브랜치인 PR)에서
  # CI가 아예 안 돈다 — 체크 목록이 비어 있어 "통과"로 오해하기 쉽지만
  # 실은 실행조차 안 된 상태다. 아래 changes job이 관련 없는 잡을 건너뛰므로
  # 실행 비용은 거의 늘지 않는다.
  pull_request:

jobs:
  # 변경된 영역을 감지해 관련 없는 잡은 건너뛴다.
  # 여러 트랙이 동시에 PR을 올려도 CI 대기열이 밀리지 않는다.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # ↓↓↓ 실제 폴더 구조에 맞게 수정 ↓↓↓
          filters: |
            app:
              - 'app/**'
            server:
              - 'server/**'

  # ── 스택별 검사 (needs: changes + if 구조는 유지할 것) ──────────

  app:
    name: Frontend
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  server:
    name: Backend
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  # ── 컨테이너로 배포한다면 (선택) ──────────────────────────────
  # 빌드 성공 ≠ 동작. 이미지를 실제로 띄우고 헬스체크까지 확인하는 잡을
  # 하나 더 두면 "빌드는 통과했는데 런타임에 죽는" 클래스의 버그를 잡는다.
